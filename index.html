<script id="draw-logic">
// Pure draw function. Inject a seeded random function in tests.
function drawPeople(people, random = Math.random, retries = 200) {
  const fail = error => ({error});
  if (!Array.isArray(people) || !people.length) return fail('Add people before drawing.');
  const names = new Set();
  for (const p of people) {
    if (!p.name || !p.name.trim() || !p.household || !['Adult','Kid'].includes(p.type)) return fail('Give every person a name, household and type.');
    const key = p.name.trim().toLocaleLowerCase();
    if (names.has(key)) return fail('Each person needs a unique name: ' + p.name + '.');
    names.add(key);
  }
  const assignments = [];
  const shuffle = values => {
    const a = [...values];
    for (let i=a.length-1;i>0;i--) { const j=Math.floor(random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  };
  for (const type of ['Adult','Kid']) {
    const pool = people.filter(p=>p.type===type);
    if (!pool.length) continue;
    if (pool.length<2) return fail(type+' pool has only one person. Add someone from another household, or remove this pool.');
    const counts = new Map();
    pool.forEach(p=>counts.set(p.household,(counts.get(p.household)||0)+1));
    for (const [household,count] of counts) if (count>pool.length/2) return fail(type+' pool cannot be drawn: '+household+' has '+count+' of '+pool.length+' people, more than half. Add people from other households.');
    let recipients;
    for (let n=0;n<retries;n++) {
      const candidate=shuffle(pool);
      if (candidate.every((p,i)=>p.household!==pool[i].household)) { recipients=candidate; break; }
    }
    if (!recipients) {
      const candidates=pool.map(p=>shuffle(pool.map((_,i)=>i).filter(i=>pool[i].household!==p.household)));
      const used=new Set(), chosen=Array(pool.length);
      function search(depth) {
        if (depth===pool.length) return true;
        let giver=-1, options;
        for(let i=0;i<pool.length;i++) if(chosen[i]===undefined) {
          const available=candidates[i].filter(j=>!used.has(j));
          if(!available.length) return false;
          if(!options || available.length<options.length) {giver=i;options=available;}
        }
        for(const receiver of options) {
          chosen[giver]=receiver; used.add(receiver);
          if(search(depth+1)) return true;
          used.delete(receiver); chosen[giver]=undefined;
        }
        return false;
      }
      if(!search(0)) return fail(type+' pool has no valid draw. Check the households.');
      recipients=chosen.map(i=>pool[i]);
    }
    pool.forEach((giver,i)=>assignments.push({giver:giver.name,receiver:recipients[i].name}));
  }
  return {assignments};
}
const slug=name=>name.trim().normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');

function buildWishlists(entries, existing = {}) {
  const data = {people: Object.create(null)}, seen = new Set();
  // Whitelist only public names and ideas. Never copy contact fields.
  for (const [id, entry] of Object.entries(existing)) {
    if (entry && typeof entry.name === 'string' && Array.isArray(entry.ideas))
      data.people[id] = {name: entry.name, ideas: entry.ideas.filter(x => typeof x === 'string')};
  }
  for (const p of entries.filter(p => p.name.trim())) {
    const name = p.name.trim(), id = slug(name);
    if (!id) return {code: 'INVALID_NAME', error: 'Use letters or numbers in the name "' + name + '".'};
    if (seen.has(id)) return {code: 'DUPLICATE_NAME', error: 'Two people have names that are too similar: "' + name + '". Make their names distinct.'};
    if (data.people[id] && data.people[id].name.trim().toLowerCase() !== name.toLowerCase())
      return {code: 'SAVED_NAME_CONFLICT', error: 'The name "' + name + '" conflicts with the saved name "' + data.people[id].name + '". Use the saved name or a distinct name.'};
    seen.add(id);
    data.people[id] = {name, ideas: p.ideas.split('\n').map(s => s.trim()).filter(Boolean)};
  }
  if (!Object.keys(data.people).length) return {code: 'NO_PEOPLE', error: 'Add at least one person above or in Gift ideas.'};
  return {data};
}
function contactKind(contact) {
  const value = contact.trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return 'email';
  if (/^\+?[\d\s().-]{3,}$/.test(value) && value.replace(/\D/g,'').length >= 3) return 'sms';
  return '';
}
function deliveryTarget(person, allPeople) {
  if (person.type !== 'Kid') return person;
  const adults = allPeople.filter(p => p.householdId === person.householdId && p.type === 'Adult');
  return adults.find(p => String(p.id) === String(person.parent)) || (adults.length === 1 ? adults[0] : null);
}
function deliveryUrl(contact, message) {
  return contactKind(contact) === 'sms'
    ? 'sms:' + contact.replace(/[^+\d]/g,'') + '?&body=' + encodeURIComponent(message)
    : 'mailto:' + encodeURIComponent(contact.trim()) + '?subject=' + encodeURIComponent('Your Secret Santa link') + '&body=' + encodeURIComponent(message);
}

<script>
'use strict';
const VERSION = '1.1.1';
const app = document.getElementById('app');
const adultDefault = 'Hi {name}, here is your private Secret Santa link: {link}  Please keep it to yourself!';
const kidDefault = "Hi {name}, this link is for {kid}'s Secret Santa: {link}  Please keep it a surprise!";
let households = [], matches = null, drawCode = '', counter = 0, routeVersion = 0;
let sent = new Set(), opened = new Set(), fetched = {}, wishes = Object.create(null), extraNames = [];

let adultMessage = adultDefault, kidMessage = kidDefault;
const $ = id => document.getElementById(id);
const el = (tag, text, className) => {

  if (text !== undefined) e.textContent = text;
  if (className) e.className = className;
  return e;
};
const button = (text, action, cls) => {
  const b = el('button', text, cls); b.type = 'button'; b.onclick = action; return b;

const people = () => households.flatMap(h => h.members.map(p => ({...p, household: h.name.trim(), householdId: h.id, name: p.name.trim()})));

}

  options.forEach(([v,t]) => {const o = el('option',t); o.value = v; s.append(o);});

}
function encode(data) {
  return btoa(Array.from(new TextEncoder().encode(JSON.stringify(data)), x => String.fromCharCode(x)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decode(payload) {
  if (!/^[A-Za-z0-9_-]+$/.test(payload) || payload.length > 12000) throw Error();
  return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(payload.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0))));
}
async function fetchWishes() {
  try {
    const r = await fetch('./wishlists.json?t=' + Date.now(), {cache:'no-store',credentials:'omit',redirect:'error'});
    if (!r.ok) throw Error();
    const j = await r.json();
    if (!j.people || typeof j.people !== 'object' || Array.isArray(j.people)) throw Error();
    // Reject malformed files instead of silently dropping someone from an update.
    if (Object.entries(j.people).some(([id,p]) => !p || typeof p.name !== 'string' || !p.name.trim() || id !== slug(p.name) || !Array.isArray(p.ideas) || p.ideas.some(x => typeof x !== 'string'))) throw Error();

}
function ideasFor(data,id) {return Object.hasOwn(data,id) ? data[id].ideas : [];}
function wishText(name) {
  const id = slug(name);
  const person = people().find(p => slug(p.name) === id && Object.hasOwn(p,'giftDraft'));
  if (person) return person.giftDraft;
  return Object.hasOwn(wishes,id) ? wishes[id] : ideasFor(fetched,id).join('\n');
}
function note(text) {if ($('status')) $('status').textContent = text;}
async function copy(text, statusId = 'status') {
  try {await navigator.clipboard.writeText(text); $(statusId).textContent = 'Copied.';}
  catch {
    const t = el('textarea'); t.value = text; t.setAttribute('aria-label','Select and copy this text');
    $(statusId).after(t); t.focus(); t.select(); $(statusId).textContent = 'Select and copy the text below.';
  }
}
function renamePerson(person, name) {
  // Keep drafts on the person's stable in-memory ID, even while their name is blank.
  if (!Object.hasOwn(person,'giftDraft') && (Object.hasOwn(wishes,slug(person.name)) || Object.hasOwn(fetched,slug(person.name)))) {
    person.giftDraft=wishText(person.name); person.giftOrigin=slug(person.name);
  }
  const previous=person.name;
  person.name=name;
  if(previous!==name && person.giftDraft) ideasDirty=true;
  invalidateWishOutput();
}
function editIdeas(name, value) {
  wishes[slug(name)]=value;
  for(const p of households.flatMap(h=>h.members)) if(slug(p.name)===slug(name)) {p.giftDraft=value; if(!p.giftOrigin)p.giftOrigin=slug(name);}
  ideasDirty=true; invalidateWishOutput();
}
function newMember() {return {id:++counter,name:'',type:'Adult',contact:'',parent:''};}
function addHouse() {households.push({id:++counter,name:'',members:[newMember()]}); renderSetup();}
function renderSetup() {
  const box = $('households'); box.replaceChildren();
  for (const h of households) {
    const card = el('div',undefined,'card');
    card.append(field('Household name',h.name,v => h.name=v),button('Remove household',() => {
      households=households.filter(x=>x!==h); invalidateWishOutput(); renderSetup(); renderWishes();
    },'danger'));
    for (const p of h.members) {
      const row = el('div',undefined,'member');
      const nameField=field('Name',p.name,()=>{});
      nameField.querySelector('input').onchange=event=>{renamePerson(p,event.target.value);renderWishes();};
      row.append(nameField,
        selectField('Type',[['Adult','Adult'],['Kid','Kid']],p.type,v=>{p.type=v;renderSetup();}),
        field(p.type==='Kid'?'Contact comes from an adult':'Phone or email (optional)',p.contact,v=>p.contact=v),
        button('Remove',()=>{h.members=h.members.filter(x=>x!==p);invalidateWishOutput();renderSetup();renderWishes();},'danger'));
      row.children[2].classList.add('contact');
      if (p.type==='Kid') row.children[2].querySelector('input').disabled=true;
      row.querySelector('button').setAttribute('aria-label','Remove '+(p.name||'person')); card.append(row);
    }
    card.append(button('Add person',()=>{h.members.push(newMember());renderSetup();})); box.append(card);
  }
}
function giftNames() {
  const names = new Map();
  Object.values(fetched).forEach(p=>names.set(slug(p.name),p.name));
  [...people().map(p=>p.name),...extraNames].filter(Boolean).forEach(name=>{
    if (!names.has(slug(name))) names.set(slug(name),name);
  });
  return [...names.values()];
}
function invalidateWishOutput() {
  prepared='';
  if ($('wishoutput')) $('wishoutput').hidden=true;
  if ($('json')) $('json').value='';
  if ($('wishstatus')) $('wishstatus').textContent=hadPrepared ? 'Your ideas changed. Prepare a new update before uploading.' : '';
}
function renderWishes() {
  const box=$('wishboxes'); if(!box) return; box.replaceChildren();
  const names=giftNames();
  if (!names.length) box.append(el('p','Add a person below or enter people in step 1.','muted'));
  for (const name of names) box.append(field('Gift ideas for '+name,wishText(name),v=>{
    editIdeas(name,v);
  },'textarea'));
}
function wishResult() {
  const conflict=people().find(p=>p.giftOrigin && p.giftOrigin!==slug(p.name) && Object.hasOwn(fetched,slug(p.name)));
  if(conflict)return {code:'RENAME_CONFLICT',error:'The name '+conflict.name+' already has a published list. Choose a distinct name to keep both lists.'};
  // Validate setup names separately because the editor intentionally displays one box per ID.
  const check=buildWishlists([...people().map(p=>({name:p.name,ideas:wishText(p.name)})),...extraNames.filter(name=>!people().some(p=>slug(p.name)===slug(name))).map(name=>({name,ideas:wishText(name)}))],fetched);
  if (check.error && check.code!=='NO_PEOPLE') return check;
  return buildWishlists(giftNames().map(name=>({name,ideas:wishText(name)})),fetched);
}
function generateWishlists() {
  invalidateWishOutput();
  if (loading) {$('wishstatus').textContent='Saved ideas are still loading. Try again in a moment.'; return;}
  if (!sourceReady) {$('wishstatus').textContent='Load saved ideas before preparing an update, or explicitly start a new wish list file below.'; return;}
  const result=wishResult();
  if (result.error) {$('wishstatus').textContent=result.error; return;}
  prepared=JSON.stringify(result.data,null,2); hadPrepared=true;
  ideasDirty=ideasDirty || prepared!==JSON.stringify(buildWishlists([],fetched).data,null,2);
  $('json').value=prepared; $('wishoutput').hidden=false;
  $('wishstatus').textContent=newWishFile
    ? 'New file ready. Uploading this file will replace all published gift ideas with the people shown here.'
    : 'Update ready. Download the file, then upload it to GitHub.';
}
function downloadWishes() {
  if (!prepared) return;
  const url=URL.createObjectURL(new Blob([prepared+'\n'],{type:'application/json'}));
  const a=el('a'); a.href=url; a.download='wishlists.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  $('wishstatus').textContent=newWishFile ? 'New file downloaded. Uploading it replaces all published gift ideas.' : 'Download requested. Upload wishlists.json to GitHub and commit to publish your ideas.';
}
function markUploaded() {
  if (!prepared) return;
  fetched=JSON.parse(prepared).people; ideasDirty=false; wishes=Object.create(null); extraNames=[];
  for(const p of households.flatMap(h=>h.members)) {delete p.giftDraft;delete p.giftOrigin;}
  newWishFile=false;
  $('wishstatus').textContent='Marked as uploaded. Reopen a recipient link after deployment to check the ideas.';
}
function needsWarning() {return ideasDirty || Boolean(matches && sent.size<people().length);}
function validate() {
  if (households.some(h=>!h.name.trim()||!h.members.length)) return 'Give each household a name and at least one person.';
  if (new Set(households.map(h=>h.name.trim().toLowerCase())).size!==households.length) return 'Use a different name for each household.';
  const ids=people().map(p=>slug(p.name));
  if (ids.some(id=>!id)) return 'Use a name containing letters or numbers for every person.';
  if (new Set(ids).size!==ids.length) return 'Two names are too similar. Give each person a more distinct name.';
  return '';
}
function draw() {
  if (matches && !confirm('Old links will still show old matches. Make sure everyone uses only the newest link.')) return;
  const validation=validate(), result=validation?{error:validation}:drawPeople(people());
  if (result.error) {$('error').textContent=result.error;return;}
  matches=result.assignments;
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code;
  do {code=Array.from(crypto.getRandomValues(new Uint8Array(4)),b=>alphabet[b%32]).join('');} while(code===drawCode);
  drawCode=code; sent.clear(); opened.clear(); updateDrawView();
}
function updateDrawView() {
  const ps=people();
  $('setupfields').disabled=Boolean(matches); $('peopledetails').open=!matches;
  $('setupsummary').textContent=matches ? `${ps.filter(p=>p.type==='Adult').length} adults, ${ps.filter(p=>p.type==='Kid').length} kids, ${households.length} households` : 'Add people and households';
  $('drawsection').hidden=Boolean(matches); $('delivery').hidden=!matches; $('redraw').hidden=!matches;
  $('step1').className=matches?'':'active'; $('step2').className=''; $('step3').className=matches?'active':'';
  if(matches) renderDelivery();
}
function linkFor(p) {
  const match=matches.find(m=>m.giver===p.name);
  return location.origin+location.pathname+'#/r/'+encode({g:p.name,r:match.receiver,rid:slug(match.receiver),k:p.type==='Kid'?p.name:'',d:drawCode});
}
function openMessage(p,target) {
  const link=linkFor(p);
  const message=(p.type==='Kid'?kidMessage:adultMessage).replace(/\{(name|link|kid)\}/g,(_,key)=>({name:target.name,link,kid:p.type==='Kid'?p.name:''})[key]);
  opened.add(p.id); renderDelivery(); location.href=deliveryUrl(target.contact,message);
}
function renderDelivery() {
  const box=$('sendrows'); box.replaceChildren(); const ps=people();
  $('progress').textContent=sent.size===ps.length
    ? `All ${ps.length} links marked sent. You're done!`
    : `Draw ${drawCode}: ${sent.size} of ${ps.length} links marked sent.`;
  $('progress').className=sent.size===ps.length?'complete':'notice';
  for (const p of ps) {
    const card=el('div',undefined,'card'), head=el('div',undefined,'row between');
    head.append(el('h3',p.name),el('span',sent.has(p.id)?'✓ Sent':opened.has(p.id)?'Message opened':'Ready to share',sent.has(p.id)?'sent':'muted')); card.append(head);
    const target=deliveryTarget(p,ps);
    if(p.type==='Kid') {
      const adults=ps.filter(a=>a.householdId===p.householdId&&a.type==='Adult');
      if(adults.length>1) card.append(selectField('Adult receiving '+p.name+'\'s link',[['','Choose an adult'],...adults.map(a=>[String(a.id),a.name])],target?String(target.id):'',v=>{
        originalPerson(p.id).parent=v;renderDelivery();
      }));
      card.append(el('p',target?`Send ${p.name}'s link to ${target.name}.`:adults.length?'Choose an adult in this household, or copy the link.':'No adult in this household. Copy the link to share it.','muted'));
    }

    if(kind) actions.append(button(kind==='sms'?'Send text':'Send email',()=>openMessage(p,target),'primary'));
    actions.append(button('Copy link',()=>copy(linkFor(p))));

      const details=el('details',undefined,'contact-edit');details.append(el('summary','Contact for '+target.name));
      const input=field('Phone or email',target.contact,v=>originalPerson(target.id).contact=v);

async function clearAll() {

  sourceReady=false;newWishFile=false;
  ideasDirty=false;prepared='';hadPrepared=false;loading=false;loadFailed=false;adultMessage=adultDefault;kidMessage=kidDefault;organizer();

function organizer() {

async function route() {
